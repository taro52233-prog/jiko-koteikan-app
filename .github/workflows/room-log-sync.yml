name: 楽天ROOM 実施ログの記録

# digest Issue のチェックボックスを付け外しすると、その内容をログに書き戻す。
# 「別の場所に記録しに行く」運用は続かないので、届いた Issue を叩くだけで
# 継続日数・オリジナル写真の回数が溜まるようにしている。
on:
  issues:
    types: [edited]

concurrency:
  group: room-log-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    # digest Issue 以外の編集では動かさない
    if: contains(github.event.issue.labels.*.name, 'room-digest')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: auto-instagram/package-lock.json

      - run: npm ci
        working-directory: auto-instagram

      - name: チェック状態を読み戻す
        working-directory: auto-instagram
        run: node scripts/sync-room-log.js

      - name: ログをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-instagram/data/room-log.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(room): 実施ログを更新 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
