name: IG へ投稿

on:
  schedule:
    # 12:00 JST / 20:00 JST（= 03:00, 11:00 UTC）
    # Instagram の反応が伸びやすい昼休みと帰宅後の時間帯に合わせている
    - cron: '0 3,11 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: '対象を1件に限定する場合の slug'
        required: false
      dry_run:
        description: '実際には投稿しない'
        type: boolean
        default: false

concurrency:
  group: ig-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: auto-instagram/package-lock.json

      - run: npm ci
        working-directory: auto-instagram

      - name: 投稿
        working-directory: auto-instagram
        env:
          POST_MODE: ${{ vars.POST_MODE || 'review' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v23.0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node src/cli.js publish ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}

      # 公開済みの画像は Instagram 側に取り込まれているので保持不要。
      # 置きっぱなしにするとリポジトリが際限なく膨らむ。
      - name: 公開済み画像を掃除
        working-directory: auto-instagram
        run: node scripts/prune.js

      - name: 結果をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ig auto-instagram/data
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore(ig): 投稿結果を記録 [skip ci]"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
