name: IG トークン期限チェック

# 自動投稿が「ある日突然、無言で止まる」原因の大半はアクセストークンの失効。
# 期限が近づいたら Issue で気づけるようにしておく。
on:
  schedule:
    - cron: '0 0 * * 1'   # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: auto-instagram/package-lock.json
      - run: npm ci
        working-directory: auto-instagram

      - id: token
        continue-on-error: true
        working-directory: auto-instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_GRAPH_VERSION: ${{ vars.IG_GRAPH_VERSION || 'v23.0' }}
        run: node scripts/check-token.js

      - if: steps.token.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[IG自動投稿] アクセストークンの更新が必要です',
              labels: ['ig-failure'],
              body: [
                'Instagram のアクセストークンが失効間近、または無効です。',
                '',
                '更新手順:',
                '1. `auto-instagram` で `SHORT_LIVED_TOKEN=<新しい短期トークン> npm run token:exchange`',
                '2. 出力された長期トークンを Secrets の `IG_ACCESS_TOKEN` に貼り替える',
                '',
                `失敗したジョブ: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
